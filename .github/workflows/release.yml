name: Release

# Pushing a tag vX.Y.Z tests the package on the whole CI matrix, then publishes
# it to npm with provenance. There is no npm token: npm trusted publishing
# (OIDC) is configured on npmjs.com for this repository and this file name, so
# keep the file name release.yml. Steps: RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.x"
      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Pin npm
        run: npm install --global npm@11.19.1
      - name: The tag is on main and equals the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match package.json version v$version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $TAG is not on main"
            exit 1
          fi
          echo "publishing jubarteai@$version"
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public
