name: Release

# Pushing a tag vX.Y.Z tests the package on the whole CI matrix, builds the
# tarball in a job that has no publishing rights, then publishes exactly that
# tarball to npm with provenance. There is no npm token: npm trusted publishing
# (OIDC) is configured on npmjs.com for this repository and this file name, so
# keep the file name release.yml. Steps: RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Runs npm ci (devDependency install scripts) and prepack, so it gets no
  # id-token and no persisted git credentials.
  build:
    name: Build the tarball
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22.3"
      - run: npm ci
      - run: npm run build
      - name: Pack
        run: npm pack --pack-destination "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Holds the OIDC id-token permission, so it runs no install script and no build: it only
  # checks the tag and publishes the tarball from the build job.
  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      # The checkout is only for the "tag is on main" check.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Trusted publishing needs npm 11.5.1 or newer; the check step below enforces it.
          node-version: "24.22.3"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package
          path: ${{ runner.temp }}/package
      - name: The tag equals the tarball's version and is on main
        id: check
        env:
          TAG: ${{ github.ref_name }}
          PACKAGE_DIR: ${{ runner.temp }}/package
        run: |
          set -eu
          npm_version="$(npm --version)"
          node -e 'const [maj, min, pat] = process.argv[1].split(".").map(Number); process.exit(maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1))) ? 0 : 1)' "$npm_version" \
            || { echo "npm $npm_version is older than 11.5.1"; exit 1; }
          count="$(find "$PACKAGE_DIR" -maxdepth 1 -name '*.tgz' | wc -l | tr -d ' ')"
          [ "$count" = "1" ] || { echo "expected one tarball, found $count"; exit 1; }
          tarball="$(find "$PACKAGE_DIR" -maxdepth 1 -name '*.tgz')"
          name="$(tar -xOzf "$tarball" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')"
          version="$(tar -xOzf "$tarball" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
          [ "$name" = "jubarteai" ] || { echo "tarball is $name, not jubarteai"; exit 1; }
          [ "$TAG" = "v$version" ] || { echo "tag $TAG does not match the tarball version v$version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $TAG is not on main"; exit 1; }
          # A prerelease (any "-" in the version) never takes the latest tag.
          case "$version" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          echo "publishing jubarteai@$version with dist-tag $dist_tag"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
      - name: Publish
        env:
          TARBALL: ${{ steps.check.outputs.tarball }}
          DIST_TAG: ${{ steps.check.outputs.dist_tag }}
        run: npm publish "$TARBALL" --tag "$DIST_TAG" --provenance --access public --ignore-scripts
