name: CI

# One run per change, sized to what can differ:
# - checks: typecheck, lint, build and the package contents don't depend on the OS or the Node patch, so they run once.
# - test: every supported Node (each line's floor and its newest release) on Linux, where runners are fastest; macOS
#   and Windows once each on the current LTS, for what does depend on the OS (paths, file modes, pty, processes).
# - old-node: the floor refusal is plain JavaScript in bin/jubarteai.js, so one OS covers it.
# Branch pushes are tested by their pull request; push runs only for main. Tag pushes are tested by release.yml,
# which calls this workflow.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A new commit on a pull request cancels that PR's older run; main and release runs always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Typecheck, lint, build, package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.x"
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Package contents are bin, dist, assets, README, CHANGELOG, STABILITY and LICENSE only
        run: |
          npm pack --dry-run --json --ignore-scripts > pack.json
          node -e '
            const [{ files }] = JSON.parse(require("node:fs").readFileSync("pack.json", "utf8"));
            const allowed = (p) => /^(bin|dist|assets)\//.test(p) || ["package.json", "README.md", "CHANGELOG.md", "STABILITY.md", "LICENSE"].includes(p);
            const stray = files.map((f) => f.path).filter((p) => !allowed(p) || /\.test\.(js|d\.ts)$/.test(p));
            if (stray.length > 0 || files.length === 0) {
              console.error("unexpected files in the package:", stray);
              process.exit(1);
            }
            console.log(files.length + " files in the package");
          '
          rm pack.json
      - name: Smoke test the entry point
        run: |
          node bin/jubarteai.js --version
          node bin/jubarteai.js --help

  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Windows is run and reported but does not gate a merge or a release: the suite was written against POSIX
    # (sh stub binaries, ":" in PATH, /dev/null) and is not portable yet. Remove this line once it is green.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # The three floors (keep in step with package.json "engines" and
        # src/node-floor.ts), then the newest release of each line.
        node: ["22.23.5", "24.22.3", "26.13.1", "22.x", "24.x", "26.x"]
        include:
          - os: macos-latest
            node: "24.x"
          - os: windows-latest
            node: "24.x"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          # "22.x" would otherwise resolve to an older release preinstalled on the runner.
          check-latest: true
          cache: npm
      # The completion tests syntax-check the zsh and fish scripts with the real shells and skip a shell that is
      # missing. Ubuntu runners ship neither; the scripts don't depend on Node, so one Linux job installs them.
      - name: Install zsh and fish for the completion syntax checks
        if: runner.os == 'Linux' && matrix.node == '24.x'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends zsh fish
      - run: npm ci
      # The integration tests drive the built binary.
      - run: npm run build
      - run: npm test -- --reporter=default --reporter=json --outputFile.json=vitest-report.json
      # Every failed test as a few notice annotations (Actions keeps only 10 error annotations per step, and
      # annotations can be read without access to the job log).
      - name: Failure digest
        if: failure()
        run: node scripts/ci-failure-digest.mjs vitest-report.json

  # Under a Node below the floor the entry point must refuse with the floor
  # message (exit 1), except `hook`, which exits 0 and says nothing so a harness
  # never sees an error from us (spec section 8, I7).
  old-node:
    name: Node 20 refuses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.x"
      - name: The floor message and exit 1
        run: |
          node --version
          set +e
          node bin/jubarteai.js --version >stdout.txt 2>stderr.txt
          code=$?
          set -e
          cat stderr.txt
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }
          test ! -s stdout.txt || { echo "expected empty stdout"; exit 1; }
          grep -Eq '^jubarteai needs Node 22\.23\.5 or newer \(you have 20\.[0-9.]+\)\. Upgrade: https://nodejs\.org/en/download' stderr.txt
      - name: hook exits 0 and prints nothing
        run: |
          set +e
          node bin/jubarteai.js hook session-start >stdout.txt 2>stderr.txt </dev/null
          code=$?
          set -e
          test "$code" -eq 0 || { echo "expected exit 0, got $code"; exit 1; }
          test ! -s stdout.txt || { echo "expected empty stdout"; exit 1; }
          test ! -s stderr.txt || { echo "expected empty stderr"; exit 1; }
